name: Kafka 4 Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kafka4-tests:
    # Integration tests against a single-node apache/kafka:4.4.0 KRaft broker
    # (started by Testcontainers), covering the versions only Kafka 4.x
    # negotiates: Metadata v13, FindCoordinator v6, OffsetCommit/OffsetFetch v10.
    name: Kafka 4 Tests (apache/kafka 4.4.0)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      MIX_ENV: test
      ENABLE_TESTCONTAINERS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir & Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27.2"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-27.2-1.18-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-27.2-1.18-

      - name: Install dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
          mix deps.compile

      - name: Compile application
        run: mix compile --warnings-as-errors

      - name: Check Docker availability
        run: docker --version

      - name: Pull Docker images
        run: docker pull apache/kafka:4.4.0

      # No automatic --failed retries (unlike the chaos job): this suite is
      # deterministic, so a flaky failure is a real signal worth seeing.
      - name: Run Kafka 4 Tests
        run: mix test.kafka4

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka4-test-results
          path: |
            _build/test/logs/
          retention-days: 7
